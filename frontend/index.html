<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Resume Screener</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-blue-600 text-white shadow-md p-4">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold">Smart Resume Screener</h1>
            <p class="text-sm">AI-powered parsing and matching</p>
        </div>
    </header>

    <main class="container mx-auto mt-8 p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <div class="bg-white p-6 rounded shadow-md mb-6">
                    <h2 class="text-xl font-semibold mb-4">1. Create a Job Description</h2>
                    <form id="jobForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Job Title</label>
                            <input type="text" id="jobTitle" required class="w-full border rounded p-2 focus:outline-blue-500" placeholder="e.g. Software Engineer">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Description & Requirements</label>
                            <textarea id="jobDescription" required rows="4" class="w-full border rounded p-2 focus:outline-blue-500" placeholder="Required skills, experience, etc."></textarea>
                        </div>
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Create Job</button>
                    </form>
                </div>

                <div class="bg-white p-6 rounded shadow-md">
                    <h2 class="text-xl font-semibold mb-4">2. Upload Resume</h2>
                    <form id="uploadForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Select Job</label>
                            <select id="jobSelect" required class="w-full border rounded p-2 focus:outline-blue-500">
                                <option value="" disabled selected>Loading jobs...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Upload PDF</label>
                            <input type="file" id="resumeFile" accept="application/pdf" required class="w-full border rounded p-2">
                        </div>
                        <button type="submit" id="uploadBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Screen Resume</button>
                        <p id="uploadStatus" class="text-sm text-gray-600 mt-2 hidden"></p>
                    </form>
                </div>
            </div>

            <div class="bg-white p-6 rounded shadow-md h-fit">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">3. Shortlisted Candidates</h2>
                    <button id="refreshMatches" class="text-sm text-blue-600 hover:underline">Refresh</button>
                </div>
                
                <div id="resultsArea" class="space-y-4">
                    <p class="text-gray-500 italic">Select a job on the left and process resumes to see matches.</p>
                </div>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
